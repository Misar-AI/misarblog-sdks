name: Publish Java SDK

# See publish-typescript.yml for why workflow_call exists: auto-tag.yml cannot
# rely on the tag it pushes to start this workflow, so it calls it directly.
on:
  push:
    tags: ['java/v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version being published (optional; pom.xml wins)'
        required: false
        type: string
  workflow_call:
    inputs:
      version:
        description: 'Version being published (optional; pom.xml wins)'
        required: false
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Maven Central needs both an OSSRH login and a GPG signing key; a
      # release missing any one of the four is rejected at the very end, after
      # a full build. Check up front and name the exact secret instead.
      - name: Require publishing credentials
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_TOKEN: ${{ secrets.OSSRH_TOKEN }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          MISSING=""
          [ -n "${OSSRH_USERNAME:-}" ]  || MISSING="$MISSING OSSRH_USERNAME"
          [ -n "${OSSRH_TOKEN:-}" ]     || MISSING="$MISSING OSSRH_TOKEN"
          [ -n "${GPG_PRIVATE_KEY:-}" ] || MISSING="$MISSING GPG_PRIVATE_KEY"
          [ -n "${GPG_PASSPHRASE:-}" ]  || MISSING="$MISSING GPG_PASSPHRASE"
          if [ -n "$MISSING" ]; then
            for s in $MISSING; do
              echo "::error::Cannot publish the Java SDK to Maven Central: repository secret $s is not set."
            done
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE
      - run: mvn --no-transfer-progress --batch-mode test
        working-directory: java
      - run: mvn --no-transfer-progress --batch-mode deploy -P release
        working-directory: java
        env:
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
