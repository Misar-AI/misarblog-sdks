name: Validate & Tag Swift SDK
on:
  push:
    tags: ['swift/v*']
  workflow_dispatch:
# SPM resolves directly from GitHub tags — the tag itself is the "publish".
#
# Consumers depend on misarblog-swift, NOT this monorepo: SwiftPM requires
# Package.swift at the repository root and cannot resolve a subdirectory.
# split-standalone.yml mirrors swift/ there and pushes the vX.Y.Z tag that
# SPM actually resolves; this job is the gate that it compiles and passes
# tests first.
# Consumers add: .package(url: "https://github.com/Misar-AI/misarblog-swift.git", from: "1.0.0")
jobs:
  validate:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: swift build -c release
        working-directory: swift
      - run: swift test
        working-directory: swift
