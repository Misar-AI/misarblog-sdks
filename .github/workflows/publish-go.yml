name: Validate & Tag Go SDK

# Go modules are served directly from GitHub — pkg.go.dev auto-indexes on git tag.
# There is no credential and nothing to push: this job only proves the tagged
# commit compiles and passes, because once a tag is fetched by the module proxy
# it is immutable.
#
# workflow_call is here so auto-tag.yml (or any future caller) can run this in
# its own run; a tag created with the default GITHUB_TOKEN emits no push event.
on:
  push:
    tags: ['go/v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version being validated (optional; informational only)'
        required: false
        type: string
  workflow_call:
    inputs:
      version:
        description: 'Version being validated (optional; informational only)'
        required: false
        type: string

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - run: go build ./...
        working-directory: go
      - run: go test ./...
        working-directory: go
      - run: go vet ./...
        working-directory: go
