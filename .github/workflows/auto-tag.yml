name: Auto-tag on SDK sync

# Tagging IS releasing: each publish-<lang>.yml triggers on the tag this job
# creates, so a tag pushed here goes straight to the registry.
#
# SAFETY GATE — the repository variable SDK_PUBLISH_TARGETS decides which
# languages may be tagged, and therefore which may publish:
#
#   unset / empty   nothing is tagged; the job reports what it would have done
#   python,rust     only those two
#   all             every changed SDK
#
# It defaults to off because a sync that touches every SDK directory would
# otherwise release every package at once, and a published version can never
# be replaced. Enable one language, confirm it on the registry, then widen.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # A tag pushed with the default GITHUB_TOKEN does NOT start another
          # workflow — GitHub suppresses those events to stop workflows
          # retriggering themselves. Every publish-<lang>.yml here triggers on
          # `push: tags:`, so with GITHUB_TOKEN the tag lands and nothing
          # publishes, silently and with this job still reporting success.
          # RELEASE_TOKEN (a PAT with `contents: write`) is what makes the
          # chain actually fire.
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: Tag changed SDKs
        env:
          TARGETS: ${{ vars.SDK_PUBLISH_TARGETS }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          GATE=",$(echo "${TARGETS:-}" | tr -d '[:space:]'),"

          if [ -z "${RELEASE_TOKEN:-}" ]; then
            echo "::warning::RELEASE_TOKEN is not set — tags will be created with GITHUB_TOKEN, which cannot trigger publish-<lang>.yml. Nothing will publish; each SDK would need its publish workflow run by hand."
          else
            echo "RELEASE_TOKEN present — tags will trigger publish-<lang>.yml."
          fi
          if [ "$GATE" = ",," ]; then
            echo "::notice::SDK_PUBLISH_TARGETS is unset — DRY RUN, nothing will be tagged or published."
          else
            echo "::notice::Tagging enabled for: ${TARGETS}"
          fi

          # Determine changed dirs (handle first-ever push gracefully)
          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            CHANGED=$(git ls-files --others --cached | head -1 && git diff --name-only HEAD~1 HEAD 2>/dev/null || git show --name-only --format="" HEAD)
          else
            CHANGED=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} 2>/dev/null || git diff --name-only HEAD~1 HEAD)
          fi
          echo "Changed files: $CHANGED"

          extract_version() {
            local lang=$1
            case $lang in
              typescript|cli|solidity)
                jq -r '.version // "0.1.0"' ${lang}/package.json 2>/dev/null || echo "0.1.0" ;;
              python)
                grep '^version' python/pyproject.toml 2>/dev/null | grep -oE '"[^"]+"' | tr -d '"' | head -1 || echo "0.1.0" ;;
              rust)
                grep '^version' rust/Cargo.toml 2>/dev/null | grep -oE '"[^"]+"' | tr -d '"' | head -1 || echo "0.1.0" ;;
              ruby)
                grep -h 's\.version\|spec\.version' ruby/*.gemspec 2>/dev/null | grep -oE '"[^"]+"' | tr -d '"' | head -1 || echo "0.1.0" ;;
              java)
                grep '<version>' java/pom.xml 2>/dev/null | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || echo "0.1.0" ;;
              kotlin)
                grep '^version' kotlin/build.gradle.kts 2>/dev/null | grep -oE '"[^"]+"' | tr -d '"' | head -1 || echo "0.1.0" ;;
              csharp)
                grep '<Version>' csharp/*.csproj 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1 || echo "0.1.0" ;;
              dart|flutter)
                grep '^version' ${lang}/pubspec.yaml 2>/dev/null | awk '{print $2}' | head -1 || echo "0.1.0" ;;
              *)
                cat ${lang}/VERSION 2>/dev/null | tr -d '[:space:]' || echo "0.1.0" ;;
            esac
          }

          git config user.email "ci@misar.io"
          git config user.name "Misar CI"

          # go, php and swift are deliberately absent: none of them carries a
          # version manifest, because for all three the git tag IS the release
          # (proxy.golang.org, Packagist and SwiftPM each read the tag). There
          # is nothing here to derive a version from, so they are tagged by hand.
          # c/cpp/cli/solidity are gone — those directories no longer exist.
          for lang in typescript python rust ruby java kotlin csharp dart flutter; do
            if echo "$CHANGED" | grep -qE "^${lang}/"; then
              VERSION=$(extract_version $lang)
              # extract_version returns EMPTY on a miss, not the "0.1.0" its
              # `|| echo` suggests: `||` tests the pipeline's status and the
              # trailing tr/grep/head exits 0 even on empty input. Unguarded
              # that produced tags literally named "<lang>/v", which then match
              # publish-<lang>.yml's `*/v*` trigger while failing its regex.
              if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
                echo "::warning::${lang}: no usable version (got '${VERSION}') — not tagging."
                echo "- \`${lang}\` skipped: no usable version" >> "$GITHUB_STEP_SUMMARY"
                continue
              fi
              TAG="${lang}/v${VERSION}"
              if git tag | grep -qx "$TAG"; then
                echo "⏭  Tag $TAG already exists, skipping."
              elif ! echo "$GATE" | grep -q ",${lang}," && ! echo "$GATE" | grep -q ",all,"; then
                echo "🔒 Would tag $TAG — skipped, ${lang} is not in SDK_PUBLISH_TARGETS."
                echo "- \`$TAG\` withheld (gate)" >> "$GITHUB_STEP_SUMMARY"
              else
                echo "🏷  Creating tag $TAG"
                git tag "$TAG"
                git push origin "$TAG"
                echo "- \`$TAG\` tagged → publish-${lang}.yml will run" >> "$GITHUB_STEP_SUMMARY"
              fi
            fi
          done
