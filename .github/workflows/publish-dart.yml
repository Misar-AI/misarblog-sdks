name: Publish Dart SDK

# See publish-typescript.yml for why workflow_call exists: auto-tag.yml cannot
# rely on the tag it pushes to start this workflow, so it calls it directly.
on:
  push:
    tags: ['dart/v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version being published (optional; pubspec.yaml wins)'
        required: false
        type: string
  workflow_call:
    inputs:
      version:
        description: 'Version being published (optional; pubspec.yaml wins)'
        required: false
        type: string

jobs:
  publish:
    # `dart pub publish` falls back to an interactive OAuth prompt when the
    # credentials file is stale or incomplete, and --force does not suppress
    # it. Without a cap the job sits at that prompt until the 6-hour runner
    # limit, looking indistinguishable from slow work. Observed: 30+ minutes
    # on `dart pub publish --force` with every prior step green.
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require publishing credentials
        env:
          PUB_CREDENTIALS: ${{ secrets.PUB_CREDENTIALS }}
        run: |
          if [ -z "${PUB_CREDENTIALS:-}" ]; then
            echo "::error::Cannot publish the Dart SDK to pub.dev: repository secret PUB_CREDENTIALS is not set. It must hold the whole pub-credentials.json produced by \`dart pub login\`."
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
        working-directory: dart
      - run: dart analyze
        working-directory: dart
      - run: dart test
        working-directory: dart

      # `dart pub publish` does not read a PUB_CREDENTIALS environment variable —
      # it only ever reads the credentials FILE. Passing the secret as env (which
      # is what this workflow used to do) is silently ignored and the publish
      # then fails on "No credentials". Write the file instead, to both the
      # modern and the legacy location so an SDK bump cannot break it. Nothing is
      # echoed: printf writes straight to the file.
      - name: Install pub credentials
        env:
          PUB_CREDENTIALS: ${{ secrets.PUB_CREDENTIALS }}
        run: |
          mkdir -p "$HOME/.config/dart" "$HOME/.pub-cache"
          printf '%s' "$PUB_CREDENTIALS" > "$HOME/.config/dart/pub-credentials.json"
          printf '%s' "$PUB_CREDENTIALS" > "$HOME/.pub-cache/credentials.json"
          chmod 600 "$HOME/.config/dart/pub-credentials.json" "$HOME/.pub-cache/credentials.json"

      - run: dart pub publish --force
        working-directory: dart
