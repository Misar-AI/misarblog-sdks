[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "misarblog"
version = "5.0.1"
description = "Sync + async client for misar.blog, a hosted blogging platform: publish and schedule Markdown articles, manage drafts and series, read comments, reactions, follows and analytics, generate SEO titles, completions and AI cover images, and search."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Misar AI", email = "hello@misar.io" }]
keywords = [
  "misarblog",
  "misar",
  "blog",
  "blogging",
  "publishing",
  "cms",
  "headless-cms",
  "articles",
  "markdown",
  "content-api",
  "api-client",
  "sdk",
  "seo",
  "asyncio",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Text Processing :: Markup :: Markdown",
  "Framework :: AsyncIO",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27"]

[project.urls]
Homepage = "https://www.misar.blog"
Documentation = "https://docs.misar.io/blog"
Repository = "https://github.com/Misar-AI/misarblog-sdks"
Issues = "https://github.com/Misar-AI/misarblog-sdks/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "build", "twine", "ruff"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["misarblog"]

[tool.ruff]
line-length = 100
target-version = "py39"
