[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "misarblog"
version = "1.1.0"
description = "Official Python SDK for Misar.Blog — all 25 developer-API operations: articles, drafts, series, comments, follows, reactions, AI, images, search, analytics, plan"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Misar AI", email = "hello@misar.io" }]
keywords = ["misarblog", "blog", "sdk", "api", "content", "publishing"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = ["httpx>=0.27"]

[project.urls]
Homepage = "https://misar.blog"
Documentation = "https://docs.misar.io/blog"
Repository = "https://github.com/Misar-AI/misarblog-sdks"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "build", "twine", "ruff"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["misarblog"]

[tool.ruff]
line-length = 100
target-version = "py39"
