name: misarblog
description: >-
  Dart client for misar.blog, a hosted blogging platform: publish and schedule
  Markdown articles, manage drafts, series, comments, reactions, analytics and
  AI titles and covers.
version: 1.1.0
homepage: https://www.misar.blog/docs/sdks/dart
repository: https://github.com/Misar-AI/misarblog-sdks
documentation: https://docs.misar.io/blog
issue_tracker: https://github.com/Misar-AI/misarblog-sdks/issues

topics:
  - blog
  - publishing
  - cms
  - markdown
  - api-client

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  http: ^1.2.0

dev_dependencies:
  test: ^1.25.0
  lints: ^3.0.0
