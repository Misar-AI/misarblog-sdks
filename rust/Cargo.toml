[package]
name = "misarblog"
version = "5.0.4"
edition = "2021"
description = "Async client for misar.blog, a hosted blogging platform: publish and schedule Markdown articles, manage drafts and series, read comments, reactions, follows and analytics, generate SEO titles, completions and AI cover images, and search. Typed errors, retry with back-off."
license = "MIT"
authors = ["Misar.AI <hello@misar.io>"]
homepage = "https://www.misar.blog"
repository = "https://github.com/Misar-AI/misarblog-sdks"
documentation = "https://docs.misar.io/blog"
readme = "README.md"
keywords = ["blog", "blogging", "publishing", "cms", "markdown"]
categories = ["api-bindings", "web-programming::http-client"]

[dependencies]
reqwest = { version = "0.13.5", features = ["json"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "1.0.69"

[dev-dependencies]
wiremock = "0.6.5"
tokio = { version = "1.53.1", features = ["full"] }
