name: misarblog_flutter
description: Official Flutter SDK for Misar.Blog — secure key storage, retry, full dev-API coverage, plus the embed widget for iOS, Android, macOS, Web.
version: 5.0.1
homepage: https://www.misar.blog/docs/sdks/flutter
repository: https://github.com/Misar-AI/misarblog-sdks

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  flutter_secure_storage: ^9.0.0
  webview_flutter: ^4.7.0
  misarblog: ^1.1.0

# `misarblog` is not on pub.dev yet, so version solving fails outright and this
# package cannot even be resolved, let alone built or tested. The override points
# at the sibling package in this repo. It applies only to this package when it is
# the root, so a consumer of the published misarblog_flutter still resolves
# misarblog ^1.1.0 from pub.dev.
#
# RELEASE ORDER: publish sdks/dart (misarblog) before sdks/flutter, or the
# published Flutter package will reference a version that does not exist.
dependency_overrides:
  misarblog:
    path: ../dart

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
